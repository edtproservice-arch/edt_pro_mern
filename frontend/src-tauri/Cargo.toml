[package]
name = "edt-pro"
version = "0.2.0"
description = "EDT Pro — application de bureau"
authors = ["EDT Pro"]
edition = "2021"

[lib]
name = "edt_pro_lib"
# staticlib/cdylib : la bibliothèque que charge l'application Android (2026-10-30).
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon : l'icône de la zone de notification de Windows (2026-11-01).
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
# Notifications du système — Windows et Android (2026-10-31).
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Mise à jour automatique : desktop uniquement (le plugin n'existe pas sur mobile).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
# Démarrer avec Windows, en arrière-plan ; une seule instance (2026-11-01).
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

# Lire le choix « démarrage désactivé » de Windows (2026-11-01) : celle d'auto-launch, déjà là.
[target.'cfg(windows)'.dependencies]
winreg = "0.10"

# Scan du QR de la carte de stagiaire : mobile uniquement (2026-10-31).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
